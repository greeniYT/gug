<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henry Stickmin Launcher</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

body {
  font-family: 'Comic Neue', cursive;
  margin: 0;
  padding: 30px;
  background: radial-gradient(circle at top, #ff3b3b, #8b0000 70%);
  color: white;
  text-align: center;
}

h1 {
  font-size: 3.2em;
  margin-bottom: 10px;
  text-shadow: 4px 4px 0 #000;
}

p {
  font-size: 1.2em;
  margin-bottom: 35px;
  opacity: 0.9;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  max-width: 1000px;
  margin: auto;
}

.game-btn {
  background: linear-gradient(145deg, #ff4b4b, #c70000);
  border: 4px solid black;
  border-radius: 14px;
  padding: 15px;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
  box-shadow: 6px 6px 0 #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: white;
}

.game-btn:hover {
  transform: translate(-3px,-3px);
  box-shadow: 10px 10px 0 #000;
}

.game-btn img {
  width: 90px;
  height: 90px;
  object-fit: contain;
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
}

.game-btn span {
  font-size: 18px;
  font-weight: 700;
}

/* Fullscreen overlay */
#overlay {
  position: fixed;
  inset: 0;
  background: black;
  z-index: 1000;
  display: none;
  flex-direction: column;
}

#game-frame {
  width: 100%;
  flex: 1;
  border: none;
  background: black;
}

#top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1002;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 12px 18px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

#top-bar.visible {
  opacity: 1;
  pointer-events: all;
}

/* invisible hotzone at very top of screen */
#top-hotzone {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  z-index: 1003;
  display: none;
}

#top-bar button {
  padding: 10px 22px;
  border: 3px solid black;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 4px 4px 0 black;
  font-family: 'Comic Neue', cursive;
  transition: transform 0.1s, box-shadow 0.1s;
}

#top-bar button:hover {
  transform: translate(-2px,-2px);
  box-shadow: 7px 7px 0 black;
}

#back-btn {
  background: #ff4040;
  color: white;
}

#fullscreen-btn {
  background: #222;
  color: white;
}


</style>
</head>

<body>

<h1>Henry Stickmin Launcher</h1>
<p>Choose your mission.</p>

<div class="grid" id="gameGrid"></div>

<div id="overlay">
  <iframe id="game-frame" allowfullscreen allow="autoplay"></iframe>
</div>

<div id="top-hotzone"></div>
<div id="top-bar">
  <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  <button id="back-btn" onclick="closeGame()">← Back</button>
</div>


<script>
const games = [
  {
    name: "Breaking the Bank",
    img: "https://imgs.search.brave.com/hnM71Ez7rBz4n02zScIPN2g_PScukHwWfQhLlbchrMM/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/bnVtdWtpLmNvbS9n/YW1lL2NhcmQvYnJl/YWtpbmctdGhlLWJh/bmstNDE1OS53ZWJw",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/btb2.html"
  },
  {
    name: "Escaping the Prison",
    img: "https://imgs.search.brave.com/POT5Yzwri0zMRgbhaPrpGnf2t1mzZMV4heIVt8f-TC0/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/cGxheS1nYW1lcy5j/b20vZmlsZXMvaW1n/L2hlbnJ5LXN0aWNr/bWluLWVzY2FwaW5n/LXRoZS1wcmlzb24t/MTYzOTE2NzI0Mi5w/bmc",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/etp.html"
  },
  {
    name: "Stealing the Diamond",
    img: "https://imgs.search.brave.com/6TYmFLQB95hjVTX-B5LQbc4cNMMWuMNJjowCA59uTZc/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tLm1l/ZGlhLWFtYXpvbi5j/b20vaW1hZ2VzL00v/TVY1Qk1UTXdaRFZt/WVdRdE9EZ3hZUzAw/WVdJNExUaG1Oemd0/Wm1ZMk9XSTJNVFUy/TjJKalhrRXlYa0Zx/Y0djQC5qcGc",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/std.html"
  },
  {
    name: "Infiltrating the Airship",
    img: "https://imgs.search.brave.com/2ix4XsXLBpS1r3pcINwEpTd4ovsM2lx8cgw8cqxbpHM/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zMy51/cy1lYXN0LTIuYW1h/em9uYXdzLmNvbS9n/bWFnLmlvLWxpdmUt/dXMvZ2FtZXMvbG9n/b3MvMTMxOTNfNjQ2/NDg0OTIzZjZjZi5q/cGc",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/ita.html"
  },
  {
    name: "Fleeing the Complex",
    img: "https://imgs.search.brave.com/kAoVNM4M5yndBZ8RuyvEF64dlAZIdmQTPKeIzs0Bw30/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9wbGF5/LmdpbGVjdC5jb20v/aW1hZ2VzL2ljb25z/L2ZsZWVpbmd0aGVj/b21wbGV4LndlYnA",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/ftc.html"
  },

];

const grid = document.getElementById("gameGrid");
const iframe = document.getElementById("game-frame");
const overlay = document.getElementById("overlay");
const topBar = document.getElementById("top-bar");
const topHotzone = document.getElementById("top-hotzone");
const backBtn = document.getElementById("back-btn");
const fullscreenBtn = document.getElementById("fullscreen-btn");

let hideTimer;

topHotzone.addEventListener("mouseenter", () => {
  clearTimeout(hideTimer);
  topBar.classList.add("visible");
});

topBar.addEventListener("mouseenter", () => {
  clearTimeout(hideTimer);
  topBar.classList.add("visible");
});

topBar.addEventListener("mouseleave", () => {
  hideTimer = setTimeout(() => topBar.classList.remove("visible"), 600);
});

topHotzone.addEventListener("mouseleave", () => {
  hideTimer = setTimeout(() => topBar.classList.remove("visible"), 600);
});

games.forEach(game => {
  const btn = document.createElement("div");
  btn.className = "game-btn";
  btn.innerHTML = `
    <img src="${game.img}" onerror="this.style.display='none'">
    <span>${game.name}</span>
  `;
  btn.onclick = () => launchGame(game.url);
  grid.appendChild(btn);
});

async function launchGame(url) {
  try {
    const res = await fetch(url);
    let html = await res.text();

    // Inject a <base> tag so relative URLs (images, scripts, SWFs)
    // resolve against the original host, not the blob origin.
    const base = url.substring(0, url.lastIndexOf("/") + 1);
    html = html.replace(/<head>/i, `<head><base href="${base}">`);
    // Fallback if no <head> tag
    if (!html.includes(`<base href="${base}">`)) {
      html = `<base href="${base}">` + html;
    }

    // Blob URL gives the iframe a real origin so external assets load correctly.
    const blob = new Blob([html], { type: "text/html" });
    const blobUrl = URL.createObjectURL(blob);

    // Clean up previous blob to avoid memory leaks
    if (iframe._blobUrl) URL.revokeObjectURL(iframe._blobUrl);
    iframe._blobUrl = blobUrl;

    iframe.src = blobUrl;

    topBar.style.display = "flex";
    topHotzone.style.display = "block";
    overlay.style.display = "flex";
    document.body.style.overflow = "hidden";
  } catch (err) {
    alert("Game failed to load. Try opening in a new tab.");
    console.error(err);
  }
}

function closeGame() {
  topBar.style.display = "none";
  topBar.classList.remove("visible");
  topHotzone.style.display = "none";
  overlay.style.display = "none";
  if (iframe._blobUrl) { URL.revokeObjectURL(iframe._blobUrl); iframe._blobUrl = null; }
  iframe.src = "about:blank";
  document.body.style.overflow = "auto";
  if (document.fullscreenElement) document.exitFullscreen();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    overlay.requestFullscreen();
    fullscreenBtn.textContent = "✕ Exit Fullscreen";
  } else {
    document.exitFullscreen();
    fullscreenBtn.textContent = "⛶ Fullscreen";
  }
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    fullscreenBtn.textContent = "⛶ Fullscreen";
  }
});
</script>

</body>
</html>
