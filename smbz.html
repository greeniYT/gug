<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Unity WebGL Player | SMBZ-G</title>
  <base href="https://cdn.jsdelivr.net/gh/greeniYT/y@bb65e1b53db5f805edc9523491a85b15ed5227d5/smbz/" target="_blank">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #unity-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
    #unity-canvas { width: 100% !important; height: 100% !important; display: block; }
    #unity-loading-bar {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
    }
    #unity-warning { position: absolute; top: 0; left: 0; right: 0; z-index: 20; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full" style="width:0%"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      var div = document.createElement('div');
      div.innerHTML = msg;
      if (type === 'error') div.style.background = 'red';
      else if (type === 'warning') div.style.background = 'yellow';
      warningBanner.appendChild(div);
      warningBanner.style.display = 'block';
      if (type !== 'error') {
        setTimeout(() => { if (div.parentNode) div.parentNode.removeChild(div); }, 5000);
      }
    }

    // Try this more stable commit first
    var buildUrl = "https://cdn.jsdelivr.net/gh/greeniYT/y@bb65e1b53db5f805edc9523491a85b15ed5227d5/smbz/Build";

    var loaderUrl = buildUrl + "/SMBZ-G.html.loader.js";
    const TOTAL_PARTS = 8;
    const partUrls = Array.from({ length: TOTAL_PARTS }, (_, i) => 
      `${buildUrl}/SMBZ-G.html.data.gz.part${i + 1}`
    );

    async function fetchWithRetry(url, maxRetries = 6) {
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (res.ok) return res;
          throw new Error(`HTTP ${res.status}`);
        } catch (e) {
          console.warn(`Part fetch attempt ${attempt} failed: ${url}`);
          if (attempt === maxRetries) throw e;
          await new Promise(r => setTimeout(r, 1000 * attempt));
        }
      }
    }

    let wasmBuffer = null;

    // Override for cached wasm
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
      const url = typeof input === "string" ? input : input?.url || "";
      if (url.includes(".wasm") && wasmBuffer) {
        return Promise.resolve(new Response(wasmBuffer.slice(), { status: 200, headers: {"Content-Type": "application/wasm"} }));
      }
      return originalFetch(input, init);
    };

    async function fetchParts() {
      const blobs = [];
      for (let i = 0; i < TOTAL_PARTS; i++) {
        console.log(`[data] Downloading part ${i+1}/${TOTAL_PARTS}`);
        const response = await fetchWithRetry(partUrls[i]);
        blobs.push(await response.blob());
        progressBarFull.style.width = Math.round((i + 1) / TOTAL_PARTS * 45) + "%";
      }
      const merged = new Blob(blobs);
      const decompressed = await new Response(merged.stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
      console.log("[data] Decompressed size:", decompressed.byteLength);
      return URL.createObjectURL(new Blob([decompressed]));
    }

    async function fetchWasm() {
      console.log("[wasm] Downloading...");
      const response = await fetchWithRetry(buildUrl + "/SMBZ-G.html.wasm.gz");
      const decompressed = await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
      wasmBuffer = decompressed;
      console.log("[wasm] Decompressed size:", wasmBuffer.byteLength);
    }

    // Load the game
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = async () => {
      try {
        progressBarFull.style.width = "5%";
        const [dataUrl] = await Promise.all([fetchParts(), fetchWasm()]);
        progressBarFull.style.width = "50%";

        var config = {
          dataUrl: dataUrl,
          frameworkUrl: buildUrl + "/SMBZ-G.html.framework.js",
          codeUrl: buildUrl + "/SMBZ-G.html.wasm.gz",
          streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/greeniYT/y@latest/smbz/StreamingAssets",
          companyName: "Jonathan Miller aka Zethros",
          productName: "SMBZ-G",
          productVersion: "1.05",
          showBanner: unityShowBanner
        };

        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (50 + progress * 50) + "%";
        }).then(() => {
          loadingBar.style.display = "none";
          console.log("✅ SMBZ-G loaded!");
        }).catch(err => alert("Unity error: " + err));
      } catch (err) {
        console.error(err);
        alert("Failed to load game data.\n\nThis is usually due to jsDelivr issues with large split files.\nTry the itch.io version below.");
      }
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
