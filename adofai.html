<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ADOFAI</title>
</head>
<body>
  <script>
    async function loadAndRun() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/greeniYT/fireice@main/SADOFAI%20v1.32.html.part1",
        "https://cdn.jsdelivr.net/gh/greeniYT/fireice@main/SADOFAI%20v1.32.html.part2",
        "https://cdn.jsdelivr.net/gh/greeniYT/fireice@main/SADOFAI%20v1.32.html.part3",
        "https://cdn.jsdelivr.net/gh/greeniYT/fireice@main/SADOFAI%20v1.32.html.part4",
        "https://cdn.jsdelivr.net/gh/greeniYT/fireice@main/SADOFAI%20v1.32.html.part5",
        "https://cdn.jsdelivr.net/gh/greeniYT/fireice@main/SADOFAI%20v1.32.html.part6"
      ];

      let fullHtml = "";
      for (const u of urls) {
        const res = await fetch(u);
        fullHtml += await res.text();
      }

      document.open();
      document.write(fullHtml);
      document.close();
    }

    loadAndRun();
  </script>
</body>
</html>
