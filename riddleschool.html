<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Riddle School Launcher</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

  body {
    font-family: 'Orbitron', sans-serif;
    margin: 0; padding: 30px;
    background: #0a0a0a url('https://imgs.search.brave.com/_fQCZ8B07Pt2Q17bGKwDtpSs3NNDThazjRDJRuiHs8M/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9mbGFz/aG11c2V1bS5vcmcv/d3AtY29udGVudC91/cGxvYWRzLzIwMjMv/MDUvUmlkZGxlLVNj/aG9vbC0zX0dhbWVw/bGF5LnBuZw') center/cover no-repeat;
    color: #00ffff;
    text-align: center;
  }

  h1 {
    font-size: 3em;
    margin-bottom: 0.3em;
    text-shadow: 0 0 10px #00ffff;
  }

  p {
    font-size: 1.2em;
    color: #00cccc;
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto 60px;
  }

  .game-btn {
    background: #111;
    border: 3px solid #00ffff;
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: transform 0.3s ease, background-color 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: 0 0 8px #00ffff inset;
  }

  .game-btn img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    border-radius: 6px;
    filter: drop-shadow(0 0 5px #00ffff);
  }

  .game-btn span {
    font-weight: 700;
    font-size: 18px;
    color: #00ffff;
    text-shadow: 0 0 6px #00cccc;
  }

  .game-btn:hover {
    background-color: #00ffff;
    color: #001111;
    transform: scale(1.1);
    box-shadow: 0 0 15px #00cccc;
  }

  #game-frame {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    display: none;
    z-index: 1000;
    background: #000;
  }

  #back-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1001;
    padding: 12px 24px;
    background: #00ffff;
    color: #001111;
    border: none;
    cursor: pointer;
    font-weight: 700;
    border-radius: 10px;
    box-shadow: 0 0 10px #00cccc inset;
    display: none;
    transition: background-color 0.3s ease;
  }

  #back-btn:hover {
    background-color: #00cccc;
    color: #000;
  }
</style>
</head>

<body>
  <h1>Riddle School Launcher</h1>

  <div class="grid" id="gameGrid"></div>

  <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-forms allow-pointer-lock"></iframe>
  <button id="back-btn" onclick="closeGame()">Back to Launcher</button>

<script>
  // Easy game list: just add your new game here 👇
  const games = [
    {
      name: "Riddle School 1",
      img: "https://cdn.jsdelivr.net/gh/gn-math/covers@main/287.png",
      url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/rs/rs1.html"
    },
    {
      name: "Riddle School 2",
      img: "https://cdn.jsdelivr.net/gh/gn-math/covers@main/288.png",
      url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/rs/rs2.html"
    },
    {
      name: "Riddle School 3",
      img: "https://cdn.jsdelivr.net/gh/gn-math/covers@main/289.png",
      url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/rs/rs3.html"
    },
    {
      name: "Riddle School 4",
      img: "https://cdn.jsdelivr.net/gh/gn-math/covers@main/290.png",
      url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/rs/rs4.html"
    },
    {
      name: "Riddle School 5",
      img: "https://cdn.jsdelivr.net/gh/gn-math/covers@main/291.png",
      url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/rs/rs5.html"
    },
    {
      name: "Riddle Transfer 1",
      img: "https://cdn.jsdelivr.net/gh/gn-math/covers@main/292.png",
      url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/rs/rt.html"
    },
    {
      name: "Riddle Transfer 2",
      img: "https://cdn.jsdelivr.net/gh/gn-math/covers@main/293.png",
      url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/rs/rt2.html"
    },
    // Add more games here!
  ];

  const gameGrid = document.getElementById('gameGrid');
  const iframe = document.getElementById('game-frame');
  const backBtn = document.getElementById('back-btn');

  // Generate game buttons dynamically
  games.forEach(game => {
    const btn = document.createElement('div');
    btn.className = 'game-btn';
    btn.innerHTML = `
      <img src="${game.img}" alt="${game.name}">
      <span>${game.name}</span>
    `;
    btn.addEventListener('click', () => launchGame(game.url));
    gameGrid.appendChild(btn);
  });

  let gameRunning = false;

  async function launchGame(url) {
    try {
      iframe.src = "about:blank";

      const res = await fetch(url);
      const html = await res.text();

      const dc = iframe.contentDocument || iframe.contentWindow.document;
      dc.open();
      dc.write(html);
      dc.close();

      iframe.style.display = "block";
      backBtn.style.display = "block";
      document.body.style.overflow = "hidden";
      gameRunning = true;
    } catch {
      alert("Failed to load game");
    }
  }

  function closeGame() {
    iframe.style.display = "none";
    iframe.src = "about:blank";
    const dc = iframe.contentDocument || iframe.contentWindow.document;
    dc.open();
    dc.write("");
    dc.close();

    backBtn.style.display = "none";
    document.body.style.overflow = "auto";
    gameRunning = false;
  }
</script>
</body>
</html>
