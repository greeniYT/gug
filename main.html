<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Games - Greeni's Notebook</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --xbox-green: #107C10;
      --xbox-dark: #0F0F0F;
      --xbox-darker: #050505;
      --xbox-gray: #1F1F1F;
      --xbox-light: #FFFFFF;
      --xbox-accent: #9BF00B;
    }

    body {
      font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--xbox-darker);
      color: var(--xbox-light);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 124, 16, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(155, 240, 11, 0.05) 0%, transparent 40%);
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .back-btn {
      background: var(--xbox-gray);
      border: none;
      color: var(--xbox-light);
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      display: none;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .back-btn:hover {
      background: var(--xbox-green);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(16, 124, 16, 0.4);
    }

    .site-logo {
      height: 40px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .time-display {
      font-size: 18px;
      font-weight: 300;
      color: rgba(255,255,255,0.9);
      font-variant-numeric: tabular-nums;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--xbox-green), var(--xbox-accent));
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .user-avatar:hover {
      transform: scale(1.1);
    }

    .main-content {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .hero-section {
      position: relative;
      width: 100%;
      height: 400px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--xbox-gray);
      cursor: pointer;
      transition: transform 0.3s ease;
      display: none;
    }

    .hero-section.active {
      display: block;
    }

    .hero-section:hover {
      transform: scale(1.01);
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .hero-section:hover .hero-image {
      opacity: 0.6;
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
    }

    .hero-badge {
      display: inline-block;
      background: var(--xbox-green);
      color: white;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: 48px;
      font-weight: 300;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .hero-subtitle {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      max-width: 600px;
      line-height: 1.5;
    }

    .hero-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--xbox-green);
      border-radius: 0;
      animation: progressBar 5s linear;
    }

    @keyframes progressBar {
      from {
        width: 0%;
      }
      to {
        width: 100%;
      }
    }

    .search-container {
      max-width: 600px;
      width: 100%;
    }

    .search-bar {
      width: 100%;
      padding: 16px 24px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: var(--xbox-gray);
      color: var(--xbox-light);
      transition: all 0.2s ease;
      outline: none;
      border: 2px solid transparent;
    }

    .search-bar:focus {
      background: rgba(255,255,255,0.1);
      border-color: var(--xbox-green);
    }

    .search-bar::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--xbox-light);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: var(--xbox-green);
      border-radius: 2px;
    }

    .view-all {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .view-all:hover {
      color: var(--xbox-accent);
    }

    .games-row-container {
      position: relative;
      margin: 0 -40px;
      padding: 0 40px;
    }

    .games-row {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 20px 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .games-row::-webkit-scrollbar {
      display: none;
    }

    .game-card {
      flex: 0 0 auto;
      width: 240px;
      height: 270px;
      background: var(--xbox-gray);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      border: 2px solid transparent;
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--xbox-green);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(16, 124, 16, 0.3);
    }

    .game-card.featured {
      width: 240px;
      height: 270px;
    }

    .game-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .game-card.featured .game-image {
      height: 180px;
      position: relative;
      top: auto;
      left: auto;
      opacity: 1;
    }

    .game-card:hover .game-image {
      transform: scale(1.05);
    }

    .game-info {
      padding: 16px;
      position: relative;
      z-index: 2;
    }

    .game-card.featured .game-info {
      position: relative;
      bottom: auto;
      left: auto;
      right: auto;
      background: none;
    }

    .game-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--xbox-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .game-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .game-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: var(--xbox-green);
      color: white;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 60px;
      height: 60px;
      background: rgba(16, 124, 16, 0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .play-overlay::after {
      content: '▶';
      color: white;
      font-size: 24px;
      margin-left: 4px;
    }

    .game-card:hover .play-overlay {
      transform: translate(-50%, -50%) scale(1);
    }

    .no-results {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.5);
      font-size: 18px;
      background: var(--xbox-gray);
      border-radius: 8px;
      margin: 20px 0;
    }

    .scroll-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      background: rgba(0,0,0,0.8);
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      opacity: 0;
      transition: opacity 0.2s;
      backdrop-filter: blur(10px);
    }

    .games-row-container:hover .scroll-btn {
      opacity: 1;
    }

    .scroll-btn:hover {
      background: var(--xbox-green);
    }

    .scroll-btn.left {
      left: 20px;
    }

    .scroll-btn.right {
      right: 20px;
    }

    .game-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      flex-direction: column;
      z-index: 9999;
    }

    .game-controls {
      background: rgba(15, 15, 15, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10000;
      transition: opacity 0.3s, height 0.3s;
      backdrop-filter: blur(20px);
    }

    .game-controls.hidden {
      opacity: 0;
      height: 0;
      padding: 0;
      overflow: hidden;
    }

    .control-group {
      display: flex;
      gap: 12px;
    }

    .control-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .control-btn.primary {
      background: var(--xbox-green);
    }

    .control-btn.primary:hover {
      background: #0e6e0e;
      box-shadow: 0 4px 12px rgba(16, 124, 16, 0.4);
    }

    .game-content {
      flex: 1;
      overflow: auto;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .game-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .game-overlay.fullscreen {
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: rgba(255,255,255,0.5);
      font-size: 16px;
      gap: 12px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--xbox-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      text-align: center;
      padding: 40px;
      color: #ff4444;
      background: rgba(255, 68, 68, 0.1);
      border-radius: 8px;
      margin: 20px;
    }

    .error-message button {
      margin-top: 16px;
      padding: 10px 20px;
      background: var(--xbox-green);
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 20px;
      }
      
      .game-card {
        width: 180px;
        height: 220px;
      }
      
      .game-card.featured {
        width: 180px;
        height: 220px;
      }
      
      .hero-title {
        font-size: 32px;
      }
    }

    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tabs-container::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      padding: 12px 24px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn:hover {
      color: rgba(255,255,255,0.9);
    }

    .tab-btn.active {
      color: var(--xbox-light);
      border-bottom-color: var(--xbox-green);
    }
  </style>
</head>
<body>
  <div class="content">
    <header>
      <div class="header-left">
        <a href="index.html" class="back-btn">← Back</a>
        <img src="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/assets/games.png" alt="VAULT" class="site-logo" />
      </div>
      <div class="header-right">
        <div class="time-display" id="clock">12:00 PM</div>
        <div class="user-avatar">G</div>
      </div>
    </header>

    <div class="main-content">
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="games">Games</button>
        <button class="tab-btn" data-tab="movies">Movies</button>
        <button class="tab-btn" data-tab="other">Other Apps</button>
      </div>

      <div class="hero-section" id="heroSection">
        <img src="" alt="Featured" class="hero-image" id="heroImage">
        <div class="hero-content">
          <div class="hero-badge">Featured</div>
          <h1 class="hero-title" id="heroTitle">Game Title</h1>
          <p class="hero-subtitle" id="heroSubtitle">Click to play now</p>
        </div>
        <div class="hero-progress" id="heroProgress"></div>
      </div>

      <div class="search-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search games, apps, and more">
      </div>

      <div class="games-section">
        <div class="section-header">
          <h2 class="section-title">All Games</h2>
          <a href="#" class="view-all">View all</a>
        </div>
        
        <div class="games-row-container">
          <button class="scroll-btn left" onclick="scrollGames('left')">‹</button>
          <div class="games-row" id="gamesList">
            <div class="loading">
              <div class="spinner"></div>
              Loading games...
            </div>
          </div>
          <button class="scroll-btn right" onclick="scrollGames('right')">›</button>
        </div>
      </div>

      <div class="no-results" id="noResults" style="display: none;">
        <div style="font-size: 48px; margin-bottom: 16px;">🎮</div>
        <div>No games found matching your search.</div>
        <div style="font-size: 14px; margin-top: 8px; opacity: 0.6;">Try a different keyword</div>
      </div>
    </div>
  </div>

  <div class="game-overlay" id="gameOverlay" tabindex="-1">
    <div class="game-controls" id="gameControls">
      <div style="font-weight: 600; color: rgba(255,255,255,0.6); font-size: 14px;">Now Playing</div>
      <div class="control-group">
        <button class="control-btn" id="newTabBtn">Open in New Tab</button>
        <button class="control-btn" id="cursorToggleBtn">Hide Cursor</button>
        <button class="control-btn" id="fullscreenGameBtn">Fullscreen</button>
        <button class="control-btn primary" id="closeGameBtn">Close</button>
      </div>
    </div>
    <div class="game-content" id="gameContent" tabindex="0"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const displayHours = hours % 12 || 12;
      document.getElementById('clock').textContent = `${displayHours}:${minutes} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    let games = [];
    let allContent = [];
    let currentGameFile = null;
    let isFullscreen = false;
    let cursorHidden = false;
    let currentTab = 'games';
    let heroCycleInterval = null;

    const CONTENT_URLS = {
      games: 'https://cdn.jsdelivr.net/gh/greeniYT/gug@main/json/gamesv2.json',
      movies: 'https://cdn.jsdelivr.net/gh/greeniYT/gug@main/json/movies.json',
      other: 'https://cdn.jsdelivr.net/gh/greeniYT/gug@main/json/other.json'
    };

    async function loadContent(tab) {
      currentTab = tab;
      const url = CONTENT_URLS[tab];
      
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        games = await response.json();
        
        if (!Array.isArray(games) || games.length === 0) {
          throw new Error('No content found in JSON');
        }
        
        renderGames(games);
        setupHero(games);
      } catch (error) {
        console.error('Error loading content:', error);
        document.getElementById('gamesList').innerHTML = `
          <div class="error-message" style="display: block; background: transparent; flex: 1;">
            <div style="font-size: 24px; margin-bottom: 10px;">⚠️ Error Loading Content</div>
            <div>${error.message}</div>
            <button onclick="loadContent('${tab}')">Retry</button>
          </div>
        `;
      }
    }

    // Tab button event listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        loadContent(e.target.dataset.tab);
      });
    });

    function setupHero(gamesList) {
      if (!gamesList || gamesList.length === 0) return;
      
      // Clear any existing interval
      if (heroCycleInterval) clearInterval(heroCycleInterval);
      
      allContent = gamesList;
      let currentIndex = 0;
      
      // Set initial hero
      updateHeroDisplay(gamesList[currentIndex]);
      
      // Cycle through games every 5 seconds
      heroCycleInterval = setInterval(() => {
        currentIndex = (currentIndex + 1) % gamesList.length;
        updateHeroDisplay(gamesList[currentIndex]);
      }, 5000);
    }

    function updateHeroDisplay(item) {
      const hero = document.getElementById('heroSection');
      document.getElementById('heroImage').src = item.image;
      document.getElementById('heroTitle').textContent = item.name;
      hero.classList.add('active');
      hero.onclick = () => loadGame(item.file);
      
      // Reset progress bar animation
      const progress = document.getElementById('heroProgress');
      progress.style.animation = 'none';
      setTimeout(() => {
        progress.style.animation = 'progressBar 5s linear';
      }, 10);
    }

    function renderGames(gamesToRender) {
      const container = document.getElementById('gamesList');
      const noResults = document.getElementById('noResults');
      
      if (gamesToRender.length === 0) {
        container.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      container.innerHTML = '';

      gamesToRender.forEach((game, index) => {
        const card = document.createElement('div');
        card.className = 'game-card' + (index === 0 ? ' featured' : '');
        card.onclick = () => loadGame(game.file);

        const img = document.createElement('img');
        img.src = game.image;
        img.alt = game.name;
        img.className = 'game-image';
        img.loading = 'lazy';
        card.appendChild(img);

        const info = document.createElement('div');
        info.className = 'game-info';
        
        const title = document.createElement('div');
        title.className = 'game-title';
        title.textContent = game.name;
        info.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'game-meta';
        meta.innerHTML = ``;
        info.appendChild(meta);

        card.appendChild(info);

        const playBtn = document.createElement('div');
        playBtn.className = 'play-overlay';
        card.appendChild(playBtn);

        container.appendChild(card);
      });
    }

    function filterGames(query) {
      const lowerQuery = query.toLowerCase().trim();
      const filtered = lowerQuery === '' ? games : games.filter(game => 
        game.name.toLowerCase().includes(lowerQuery)
      );
      renderGames(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      filterGames(e.target.value);
    });

    function scrollGames(direction) {
      const row = document.getElementById('gamesList');
      const scrollAmount = 400;
      row.scrollBy({
        left: direction === 'left' ? -scrollAmount : scrollAmount,
        behavior: 'smooth'
      });
    }

    async function loadGame(file) {
      currentGameFile = file;
      try {
        const gameContent = document.getElementById('gameContent');
        gameContent.innerHTML = '';
        
        // Check if it's a Google Drive preview link (for movies)
        if (file.includes('drive.google.com')) {
          const iframe = document.createElement('iframe');
          iframe.src = file;
          iframe.style.width = '100%';
          iframe.style.height = '100%';
          iframe.style.border = 'none';
          iframe.allow = 'fullscreen';
          gameContent.appendChild(iframe);
        } else {
          // Original behavior for HTML files
          const response = await fetch(file, {cache: "no-store"});
          if (!response.ok) throw new Error(`Failed to load ${file}: ${response.statusText}`);
          const text = await response.text();

          const iframe = document.createElement('iframe');
          iframe.style.width = '100%';
          iframe.style.height = '100%';
          iframe.style.border = 'none';
          iframe.sandbox.add('allow-scripts', 'allow-same-origin', 'allow-forms', 'allow-popups', 'allow-modals');
          
          gameContent.appendChild(iframe);
          
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.open();
          doc.write(text);
          doc.close();
        }

        showOverlay();
      } catch (error) {
        document.getElementById('gameContent').innerHTML = `
          <div style="color: #ff4444; padding: 20px; text-align: center;">
            <div style="font-size: 24px; margin-bottom: 10px;">⚠️ Error</div>
            <div>${error.message}</div>
          </div>
        `;
        showOverlay();
      }
    }

    function showOverlay() {
      const overlay = document.getElementById('gameOverlay');
      overlay.style.display = 'flex';
      isFullscreen = false;
      cursorHidden = false;
      overlay.classList.remove('fullscreen');
      document.getElementById('gameControls').classList.remove('hidden');
      document.getElementById('cursorToggleBtn').textContent = 'Hide Cursor';
      document.body.style.cursor = 'auto';
      overlay.focus();
    }

    function hideOverlay() {
      document.getElementById('gameOverlay').style.display = 'none';
      document.getElementById('gameContent').innerHTML = '';
      document.body.style.cursor = 'auto';
      if (isFullscreen) {
        exitFullscreen();
        isFullscreen = false;
        document.getElementById('gameOverlay').classList.remove('fullscreen');
      }
    }

    document.getElementById('cursorToggleBtn').addEventListener('click', () => {
      cursorHidden = !cursorHidden;
      document.body.style.cursor = cursorHidden ? 'none' : 'auto';
      document.getElementById('cursorToggleBtn').textContent = cursorHidden ? 'Show Cursor' : 'Hide Cursor';
    });

    document.getElementById('newTabBtn').addEventListener('click', async () => {
      if (!currentGameFile) return;
      try {
        const response = await fetch(currentGameFile, {cache: "no-store"});
        const text = await response.text();
        const modified = text.replace('<head>', `<head>
          <title>Dashboard</title>
          <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/assets/canvas-fav.png">`);
        const blob = new Blob([modified], { type: 'text/html' });
        window.open(URL.createObjectURL(blob), '_blank');
      } catch (error) {
        alert('Error: ' + error.message);
      }
    });

    document.getElementById('fullscreenGameBtn').addEventListener('click', () => {
      const overlay = document.getElementById('gameOverlay');
      const controls = document.getElementById('gameControls');
      if (!isFullscreen) {
        enterFullscreen(overlay);
        controls.classList.add('hidden');
      } else {
        exitFullscreen();
        controls.classList.remove('hidden');
      }
      isFullscreen = !isFullscreen;
      overlay.classList.toggle('fullscreen', isFullscreen);
    });

    document.getElementById('closeGameBtn').addEventListener('click', hideOverlay);

    function enterFullscreen(element) {
      if (element.requestFullscreen) element.requestFullscreen();
      else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
      else if (element.msRequestFullscreen) element.msRequestFullscreen();
    }

    function exitFullscreen() {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && isFullscreen) {
        isFullscreen = false;
        document.getElementById('gameOverlay').classList.remove('fullscreen');
        document.getElementById('gameControls').classList.remove('hidden');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('gameOverlay').style.display === 'flex') {
        hideOverlay();
      }
    });

    // Load games on page load
    loadContent('games');
  </script>
</body>
</html>
