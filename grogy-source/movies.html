      cursor: pointer;
      border-radius: 10px;

    }

    .movie-card:hover {
      transform: scale(1.05);
      box-shadow: 7px 7px 0px #000;
    }

    .movie-card img {
      width: 100%;
      height: 320px;

      border-radius: 6px;
      border: 3px solid #0a3d2e;
      box-shadow: 3px 3px 0px #000;

      margin-top: 6px;

    }

    .movie-card p {
      font-size: 14px;
      color: #000;
      padding: 0 10px 10px;
      text-align: center;
    }

    /* Modal styles */
    #movieModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    #movieModal.active {
      display: flex;
    }

    .modal-inner {
      background: #2d7a4a;
      border: 5px solid #1a4d2e;
      box-shadow: 5px 5px 0 #000;
      border-radius: 15px;
      width: 90%;
      max-width: 900px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      color: #000;
      font-family: 'Arial Black', sans-serif;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #1a4d2e;
      border-bottom: 5px solid #0a3d2e;
      border-radius: 15px 15px 0 0;
      color: #00d4ff;
      text-shadow: 1px 1px 0 #000;
    }

    .modal-header button {
      background: #ff6b6b;
      border: 3px solid #0a3d2e;
      color: #fff;
      padding: 6px 16px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 3px 3px 0 #000;
      border-radius: 8px;
      transition: all 0.2s;
      font-family: 'Arial Black', sans-serif;
      font-size: 16px;
    }

    .modal-header button:hover {
      background: #ff5252;
      box-shadow: 5px 5px 0 #000;
      transform: scale(1.05);
    }

    .modal-content {
      flex: 1;
      background: #000;
      border-radius: 0 0 15px 15px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    iframe#movieFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .fullscreen-btn {
      background: #00d4ff;
      border: 3px solid #0a3d2e;
      color: #0a3d2e;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Arial Black', sans-serif;
      box-shadow: 3px 3px 0 #000;
      border-radius: 8px;
      margin: 10px 20px;
      align-self: flex-end;
      transition: all 0.2s;
      width: fit-content;
    }

    .fullscreen-btn:hover {
      background: #00a8cc;
      box-shadow: 5px 5px 0 #000;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .movie-card {
        width: 100%;
      }

      .modal-inner {
        height: 70vh;
      }
    }
  </style>

    function populateGrid() {
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '';
      moviesData.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${m.thumbnail}" alt="${m.title}">
          <h3>${m.title}</h3>
          <p>${m.description.slice(0, 60)}…</p>
        `;
        card.dataset.title = m.title;
        card.dataset.videoSrc = m.videoSrc;
        card.addEventListener('click', () => openModal(card.dataset));
        grid.appendChild(card);
      });
    }

    function openModal(data) {
      const modal = document.getElementById('movieModal');
      document.getElementById('modalMovieTitle').textContent = data.title;
      const frame = document.getElementById('movieFrame');
      frame.src = data.videoSrc;
      modal.classList.add('active');
      modal.focus();
    }

    function closeModal() {
      const modal = document.getElementById('movieModal');
      modal.classList.remove('active');
      document.getElementById('movieFrame').src = '';
    }

    document.getElementById('closeModal').addEventListener('click', closeModal);

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      const frame = document.getElementById('movieFrame');
      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
      } else if (frame.msRequestFullscreen) {
        frame.msRequestFullscreen();
      }
    });

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('movieModal').classList.contains('active')) {
        closeModal();
      }
    });

    populateGrid();
  </script>
