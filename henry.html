<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henry Stickmin Launcher</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

body {
  font-family: 'Comic Neue', cursive;
  margin: 0;
  padding: 30px;
  background: radial-gradient(circle at top, #ff3b3b, #8b0000 70%);
  color: white;
  text-align: center;
}

h1 {
  font-size: 3.2em;
  margin-bottom: 10px;
  text-shadow: 4px 4px 0 #000;
}

p {
  font-size: 1.2em;
  margin-bottom: 35px;
  opacity: 0.9;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  max-width: 1000px;
  margin: auto;
}

.game-btn {
  background: linear-gradient(145deg, #ff4b4b, #c70000);
  border: 4px solid black;
  border-radius: 14px;
  padding: 15px;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
  box-shadow: 6px 6px 0 #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.game-btn:hover {
  transform: translate(-3px,-3px);
  box-shadow: 10px 10px 0 #000;
}

.game-btn img {
  width: 90px;
  height: 90px;
  object-fit: contain;
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
}

.game-btn span {
  font-size: 18px;
  font-weight: 700;
}

#game-frame {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  border: none;
  display: none;
  background: black;
  z-index: 1000;
}

#back-btn {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 1001;
  padding: 12px 26px;
  background: #ff4040;
  border: 4px solid black;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 5px 5px 0 black;
  display: none;
}

#back-btn:hover {
  transform: translate(-2px,-2px);
  box-shadow: 8px 8px 0 black;
}
</style>
</head>

<body>

<h1>Henry Stickmin Launcher</h1>
<p>Choose your mission.</p>

<div class="grid" id="gameGrid"></div>

<iframe id="game-frame"></iframe>
<button id="back-btn" onclick="closeGame()">← Back</button>

<script>
const games = [
  {
    name: "Breaking the Bank",
    img: "https://imgs.search.brave.com/hnM71Ez7rBz4n02zScIPN2g_PScukHwWfQhLlbchrMM/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/bnVtdWtpLmNvbS9n/YW1lL2NhcmQvYnJl/YWtpbmctdGhlLWJh/bmstNDE1OS53ZWJw",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/btb.html"
  },
  {
    name: "Escaping the Prison",
    img: "https://imgs.search.brave.com/POT5Yzwri0zMRgbhaPrpGnf2t1mzZMV4heIVt8f-TC0/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/cGxheS1nYW1lcy5j/b20vZmlsZXMvaW1n/L2hlbnJ5LXN0aWNr/bWluLWVzY2FwaW5n/LXRoZS1wcmlzb24t/MTYzOTE2NzI0Mi5w/bmc",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/etp.html"
  },
  {
    name: "Stealing the Diamond",
    img: "https://imgs.search.brave.com/6TYmFLQB95hjVTX-B5LQbc4cNMMWuMNJjowCA59uTZc/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tLm1l/ZGlhLWFtYXpvbi5j/b20vaW1hZ2VzL00v/TVY1Qk1UTXdaRFZt/WVdRdE9EZ3hZUzAw/WVdJNExUaG1Oemd0/Wm1ZMk9XSTJNVFUy/TjJKalhrRXlYa0Zx/Y0djQC5qcGc",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/std.html"
  },
  {
    name: "Infiltrating the Airship",
    img: "https://imgs.search.brave.com/2ix4XsXLBpS1r3pcINwEpTd4ovsM2lx8cgw8cqxbpHM/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zMy51/cy1lYXN0LTIuYW1h/em9uYXdzLmNvbS9n/bWFnLmlvLWxpdmUt/dXMvZ2FtZXMvbG9n/b3MvMTMxOTNfNjQ2/NDg0OTIzZjZjZi5q/cGc",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/ita.html"
  },
  {
    name: "Fleeing the Complex",
    img: "https://imgs.search.brave.com/kAoVNM4M5yndBZ8RuyvEF64dlAZIdmQTPKeIzs0Bw30/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9wbGF5/LmdpbGVjdC5jb20v/aW1hZ2VzL2ljb25z/L2ZsZWVpbmd0aGVj/b21wbGV4LndlYnA",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/ftc.html"
  },
  {
    name: "Henry Stickmin Collection",
    img: "https://imgs.search.brave.com/w1nSmurWmOj3WBr-DYtC3J7TdRVwr-M8WYt_oiSnc38/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90aGVo/ZW5yeS1zdGlja21p/bmNvbGxlY3Rpb24u/Y29tL3dwLWNvbnRl/bnQvdXBsb2Fkcy8y/MDIxLzEwL3RoZS1o/ZW5yeS1zdGlja21p/bi1jb2xsZWN0aW9u/LTItMjQweDI0MC5q/cGc",
    url: "https://cdn.jsdelivr.net/gh/greeniYT/gug@main/hs/thsc.html"
  }
];

const grid = document.getElementById("gameGrid");
const iframe = document.getElementById("game-frame");
const backBtn = document.getElementById("back-btn");

games.forEach(game => {
  const btn = document.createElement("div");
  btn.className = "game-btn";
  btn.innerHTML = `
    <img src="${game.img}">
    <span>${game.name}</span>
  `;
  btn.onclick = () => launchGame(game.url);
  grid.appendChild(btn);
});

async function launchGame(url) {
  try {
    const res = await fetch(url);
    let html = await res.text();

    const base = url.substring(0, url.lastIndexOf("/") + 1);
    html = `<base href="${base}">` + html;

    iframe.srcdoc = html;

    iframe.style.display = "block";
    backBtn.style.display = "block";
    document.body.style.overflow = "hidden";
  } catch (err) {
    alert("Game failed to load.");
    console.error(err);
  }
}

function closeGame() {
  iframe.style.display = "none";
  iframe.srcdoc = "";
  backBtn.style.display = "none";
  document.body.style.overflow = "auto";
}
</script>

</body>
</html>
