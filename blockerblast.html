<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        
        #loading img {
            max-width: 300px;
            height: auto;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        #restart {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        
        #restart img {
            width: 200px;
            height: 50px;
            display: block;
        }
        
        #restart:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="loading">
        <img src="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/assets/logo.png" alt="Loading...">
    </div>
    
    <button id="restart">
        <img src="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/assets/bbrestart.png" alt="Restart">
    </button>
    
    <iframe id="mainFrame" src="https://script.google.com/macros/s/AKfycbzqn7WIS3kBic5TRZYAkWXwY2U_kZ3bv-SJMgbyG0F5pIkKxf7f40dG8pvMi01DxAU49w/exec"></iframe>
    
    <script>
        setTimeout(() => {
            document.getElementById('loading').classList.add('hide');
        }, 2000);
        
        document.getElementById('restart').addEventListener('click', () => {
            const iframe = document.getElementById('mainFrame');
            iframe.src = iframe.src;
        });
    </script>
</body>
</html>
