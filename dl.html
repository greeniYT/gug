<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Duck Life Game Launcher</title>

<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    text-align: center;
    color: #fff;
    background:
      linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)),
      linear-gradient(135deg, #87CEEB 0%, #E0FFFF 100%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  h1 {
    color: #FFD700;
    text-shadow: 0 0 15px #FFA500, 0 2px 4px rgba(0,0,0,0.5);
    font-weight: 900;
    font-size: 3em;
    margin-bottom: 5px;
  }

  p {
    font-size: 1.2em;
    opacity: 0.95;
    margin-bottom: 40px;
    font-weight: 600;
    color: #fff;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto 60px auto;
  }

  /* Game cards */
  .game-btn {
    background: rgba(173, 216, 230, 0.9);
    border: 4px solid #FFD700;
    border-radius: 20px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s ease-in-out;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    position: relative;
  }

  .game-btn.locked {
    opacity: 0.6;
    cursor: not-allowed;
    background: rgba(169, 169, 169, 0.7);
    border-color: #808080;
  }

  .game-btn img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    filter: drop-shadow(0 0 5px #FFD700);
  }

  .game-btn.locked img {
    filter: drop-shadow(0 0 5px #808080) grayscale(100%);
  }

  .game-btn span {
    font-size: 20px;
    font-weight: 700;
    color: #004D99;
    text-shadow: 0 0 4px rgba(255, 215, 0, 0.5);
  }

  .lock-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #FF4444;
    color: white;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    display: none;
  }

  .game-btn.locked .lock-badge {
    display: block;
  }

  .game-btn:not(.locked):hover {
    background: #FFD700;
    color: #222;
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
  }

  .game-btn.locked:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
  }

  /* iframe fullscreen */
  #game-frame {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    display: none;
    z-index: 1000;
    background: #000;
  }

  #back-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 1001;
    padding: 12px 24px;
    background: #FFD700;
    color: #222;
    border: none;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
    display: none;
    transition: background 0.3s ease;
  }

  #back-btn:hover {
    background: #FFA500;
  }

  .lock-toggle {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .lock-toggle:hover {
    background: rgba(0, 0, 0, 0.9);
  }

  .game-btn:nth-child(4) .lock-toggle {
    display: block;
  }
</style>
</head>

<body>
  <h1>🐤 Duck Life Series 🐤</h1>

  <div class="grid">
    <div class="game-btn" data-game="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/ducklife/dl.html">
      <img src="https://play-lh.googleusercontent.com/vtJKdZwiBoQ0m0QVBvCj6oFBEVCehcPktS58KspbJeQdHOfcpAuGu4eWET97KQMH7M0UChLFxMoaErlpq4isSkE=w600-h300-pc0xffffff-pd" alt="Duck Life 1">
      <span>Duck Life</span>
    </div>

    <div class="game-btn" data-game="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/ducklife/dl2.html">
      <img src="https://play-lh.googleusercontent.com/67-vyIaDu0wI3jck2P7VbZ6m_XVwXbPm2MvtO3SxHMhX6FLGeO9HwiDu8fBDmFKdWX5MxVfy3orVqUh-0MW2_Go" alt="Duck Life 2">
      <span>Duck Life 2</span>
    </div>

    <div class="game-btn" data-game="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/ducklife/dl3.html">
      <img src="https://play-lh.googleusercontent.com/EAPnCDD5Xe1513dMLacO0c_Ol6Pio7uREOk97H9aZ4j5z0rv372C__VQ3xXJaTF0Mk4e819Sjy1gOIfxs6N3k1Y" alt="Duck Life 3">
      <span>Duck Life 3</span>
    </div>

    <div class="game-btn locked" data-game="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/ducklife/dl4.html">
      <img src="https://play-lh.googleusercontent.com/AUGkRrKMtUCLVE9vCvlfMY9Ny9EBqzx17yejVtEEhvpkw-H6lJlvBHgCMqPJm8HV_tM" alt="Duck Life 4">
      <span>Duck Life 4</span>
      <div class="lock-badge">🔒 BROKEN</div>
    </div>

    <div class="game-btn" data-game="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/ducklife/dl5.html">
      <img src="https://play-lh.googleusercontent.com/JQqSn7wuCj0SxBqpBThNI33qCR9gwY0str2TIAnu-m_xrVCgZk3IPxYK2S7zC9WG0ig" alt="Duck Life 5">
      <span>Duck Life 5</span>
    </div>
  </div>

  <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-forms allow-pointer-lock"></iframe>

  <button id="back-btn" onclick="closeGame()">Back to Launcher</button>

  <script>
    const iframe = document.getElementById('game-frame');
    const backBtn = document.getElementById('back-btn');

    let gameRunning = false;

    async function launchGame(url) {
      try {
        iframe.src = "about:blank";

        const res = await fetch(url);
        const html = await res.text();

        const dc = iframe.contentDocument;
        dc.open();
        dc.write(html);
        dc.close();

        iframe.style.display = "block";
        document.body.style.overflow = "hidden";
        gameRunning = true;

      } catch (e) {
        alert("Failed to load game");
      }
    }

    function closeGame() {
      iframe.style.display = "none";
      iframe.src = "about:blank";
      iframe.contentDocument.open();
      iframe.contentDocument.write("");
      iframe.contentDocument.close();

      backBtn.style.display = "none";
      document.body.style.overflow = "auto";
      gameRunning = false;
    }

    function toggleLock(event) {
      event.stopPropagation();
      const gameBtn = event.target.closest('.game-btn');
      gameBtn.classList.toggle('locked');
      const isLocked = gameBtn.classList.contains('locked');
      event.target.textContent = isLocked ? 'Unlock' : 'Lock';
    }

    document.addEventListener("mousemove", (e) => {
      if (!gameRunning) return;

      if (e.clientY < 80) {
        backBtn.style.display = "block";
      } else {
        backBtn.style.display = "none";
      }
    });

    document.querySelectorAll(".game-btn").forEach(btn => {
      btn.addEventListener("click", function(e) {
        if (e.target.closest('.lock-toggle')) return;
        if (!this.classList.contains('locked')) {
          launchGame(this.dataset.game);
        } else {
          alert("dis game is broken :(");
        }
      });
    });
  </script>
</body>
</html>
