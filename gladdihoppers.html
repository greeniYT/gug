<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gladihoppers DEX</title>
    <style>
      /* ===== Reset & Base Styles ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      canvas:focus {
        outline: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        background: #000 url('https://cdn.jsdelivr.net/gh/z799gs/75x75x7@main/background.jpg') center/cover no-repeat fixed;
      }

      /* ===== Canvas ===== */
      #canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ===== Loading Screen ===== */
      .loading_bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        background: linear-gradient(135deg, #2976fa 0%, #6919c6 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      .loading_logo {
        width: 200px;
        height: 200px;
        margin-bottom: 60px;
        background: url('https://cdn.jsdelivr.net/gh/greeniYT/gug@main/icons/gladihoppers.png') center/contain no-repeat;
        animation: fadeIn 0.8s ease-in;
      }

      .loading_bar {
        width: min(70%, 500px);
        height: 8px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 0 0 7px rgba(34, 60, 80, 0.2);
        overflow: hidden;
      }

      .loading_bar_fill {
        height: 100%;
        width: 0%;
        border-radius: 12px;
        background: #00dc15;
        background-image: linear-gradient(
          45deg,
          rgba(0, 0, 0, 0.25) 25%,
          transparent 25%,
          transparent 50%,
          rgba(0, 0, 0, 0.25) 50%,
          rgba(0, 0, 0, 0.25) 75%,
          transparent 75%,
          transparent
        );
        background-size: 15px 15px;
        animation: slideRight 0.3s ease;
        transition: width 0.2s linear;
      }

      /* ===== Animations ===== */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes slideRight {
        from {
          width: 0%;
        }
      }

      /* ===== Responsive ===== */
      @media (max-width: 600px) {
        .loading_logo {
          width: 120px;
          height: 120px;
          margin-bottom: 40px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Game Canvas -->
    <canvas id="canvas" class="canvas" tabindex="-1"></canvas>

    <!-- Loading Screen -->
    <div class="loading_bg" id="loadingBg">
      <div class="loading_logo"></div>
      <div class="loading_bar">
        <div class="loading_bar_fill" id="loadingFill"></div>
      </div>
    </div>

    <!-- Main Game Script -->
    <script>
      // ===== Global Variables =====
      const canvas = document.getElementById('canvas');
      let ATinstance = null;
      let myGameInstance = null;
      let ysdk = null;
      let player = null;
      let leaderboard = null;
      let payments = null;
      let initGame = false;
      let nowFullAdOpen = false;
      let isDeviceTouch = false;
      let isDeviceNavigator = false;
      let scaleFactor = 1;

      // ===== Global Data Variables =====
      const cloudSaves = 'noData';
      const paymentsData = 'none';
      const playerData = JSON.stringify({
        playerAuth: 'rejected',
        playerName: 'unauthorized',
        playerId: 'unauthorized',
        playerPhoto: 'null'
      });

      const environmentData = JSON.stringify({
        language: 'en',
        domain: 'com',
        deviceType: 'desktop',
        isMobile: false,
        isDesktop: true,
        isTablet: false,
        isTV: false,
        appID: '0',
        browserLang: 'en',
        payload: '',
        promptCanShow: false,
        reviewCanShow: false,
        platform: 'Win32',
        browser: 'Chrome'
      });

      const flasgsData = JSON.stringify({
        names: [],
        values: []
      });

      // ===== Helper Functions =====
      function ATinstanceEnable(callback) {
        const check = () => {
          if (ATinstance !== null) {
            callback();
          } else {
            setTimeout(check, 1000);
          }
        };
        check();
      }

      function unityShowBanner(msg, type) {
        // Banner display handler
      }

      function FocusGame() {
        window.focus();
        canvas.focus();
      }

      function NotAuthorized() {
        return JSON.stringify({
          playerAuth: 'rejected',
          playerName: 'unauthorized',
          playerId: 'unauthorized',
          playerPhoto: 'null'
        });
      }

      // ===== Mock YSDK Functions =====
      function FullAdShow() {
        // Ad display handler
      }

      function RewardedShow(id) {
        if (myGameInstance) {
          myGameInstance.SendMessage('YandexGame', 'OpenVideo');
          myGameInstance.SendMessage('YandexGame', 'RewardVideo', id);
          myGameInstance.SendMessage('YandexGame', 'CloseVideo');
        }
      }

      function StickyAdActivity(show) {
        // Sticky ad handler
      }

      function InitLeaderboard() {
        if (myGameInstance) {
          myGameInstance.SendMessage('YandexGame', 'InitializedLB');
        }
      }

      function SetLeaderboardScores(name, score) {
        // Leaderboard update handler
      }

      function GetLeaderboardScores(nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {
        if (myGameInstance) {
          const empty = {
            technoName: nameLB,
            isDefault: false,
            isInvertSortOrder: false,
            decimalOffset: 0,
            type: '',
            entries: 'no data',
            ranks: [],
            photos: [],
            names: [],
            scores: [],
            uniqueIDs: []
          };
          myGameInstance.SendMessage('YandexGame', 'LeaderboardEntries', JSON.stringify(empty));
        }
      }

      function Review() {
        FocusGame();
      }

      function PromptShow() {
        FocusGame();
      }

      function PaintRBT(rbt) {
        // RBT rendering handler
      }

      function StaticRBTDeactivate() {
        // RBT deactivation handler
      }

      function SaveCloud(jsonData, flush) {
        // Cloud save handler
      }

      function LoadCloud(sendback) {
        if (sendback && myGameInstance) {
          myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
        }
        return Promise.resolve('noData');
      }

      function GetPayments(sendback) {
        if (sendback && myGameInstance) {
          myGameInstance.SendMessage('YandexGame', 'PaymentsEntries', 'none');
        }
        return Promise.resolve('none');
      }

      function BuyPayments(id) {
        if (myGameInstance) {
          myGameInstance.SendMessage('YandexGame', 'OnPurchaseFailed', id);
        }
      }

      function ConsumePurchase(id) {
        // Purchase consumption handler
      }

      function ConsumePurchases() {
        // Multiple purchases consumption handler
      }

      function RequestingEnvironmentData(sendback) {
        if (sendback && myGameInstance) {
          myGameInstance.SendMessage('YandexGame', 'SetEnvirData', environmentData);
        }
        return Promise.resolve(environmentData);
      }

      function InitPlayer(sendback) {
        if (sendback && myGameInstance) {
          myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', playerData);
        }
        return Promise.resolve(playerData);
      }

      function OpenAuthDialog() {
        InitPlayer(true);
      }

      function GetFlags() {
        return Promise.resolve(flasgsData);
      }

      function InitGame() {
        console.log('Game Initialization Success');
        initGame = true;
      }

      // ===== Event Listeners =====
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      window.addEventListener('pointerdown', FocusGame);
      window.addEventListener('touchstart', FocusGame);

      window.addEventListener('beforeunload', () => {
        if (myGameInstance) {
          myGameInstance.SendMessage('YandexGame', '_SaveProgress');
        }
      });

      // ===== Part Merging Function =====
      async function loadParts(baseUrl, totalParts) {
        const parts = [];

        for (let i = 0; i < totalParts; i++) {
          const resp = await fetch(baseUrl + '.part' + i);
          parts.push(await resp.arrayBuffer());
        }

        const totalSize = parts.reduce((sum, p) => sum + p.byteLength, 0);
        const merged = new Uint8Array(totalSize);
        let offset = 0;

        for (let j = 0; j < parts.length; j++) {
          merged.set(new Uint8Array(parts[j]), offset);
          offset += parts[j].byteLength;
        }

        return merged;
      }

      // ===== Game Initialization =====
      const buildUrl = 'https://cdn.jsdelivr.net/gh/z799gs/75x75x7@main/Build';

      async function startGame() {
        // Load WASM and data parts in parallel
        const wasmPromise = loadParts(buildUrl + '/6e497b0f30ff490d586ac04fd1db7ab7.wasm.br', 5);
        const dataPromise = loadParts(buildUrl + '/a8bd7adc7c6b8abb6796de15ec18c6b2.data.br', 5);

        const [wasmData, dataAssets] = await Promise.all([wasmPromise, dataPromise]);

        const wasmUrl = URL.createObjectURL(new Blob([wasmData], { type: 'application/wasm' }));
        const dataUrl = URL.createObjectURL(new Blob([dataAssets], { type: 'application/octet-stream' }));

        // Unity configuration
        const config = {
          dataUrl: dataUrl,
          frameworkUrl: buildUrl + '/3ee469f88673f096a78ccd51ee5ccedf.framework.js',
          codeUrl: wasmUrl,
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'DefaultCompany',
          productName: 'Gladihoppers_DEX',
          productVersion: '1.0',
          showBanner: unityShowBanner
        };

        // Load Unity loader script
        const script = document.createElement('script');
        script.src = buildUrl + '/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js';

        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            document.getElementById('loadingFill').style.width = progress * 100 + '%';
          })
            .then((instance) => {
              myGameInstance = instance;
              ATinstance = instance;

              // Hide loading screen
              document.getElementById('loadingBg').style.display = 'none';

              // Initialize SDK
              myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', playerData);
            })
            .catch((err) => {
              console.error('Unity Load Error:', err);
            });
        };

        document.body.appendChild(script);
      }

      // Start the game when DOM is ready
      startGame();
    </script>
  </body>
</html>
