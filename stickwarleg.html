<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="UTF-8">
  <base href="https://cdn.jsdelivr.net/gh/greeniYT/y@a8962253b2e5f7662366521797709f0eca5fb430/stick-war-legacy/" target="_blank">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>YT Game Wrapper WebGL Template</title>
  <link rel="stylesheet" href="TemplateData/style.css" nonce="7kM1qEi3lFk8GRyv_4r9pQ">
  <script src="https://cdn.jsdelivr.net/gh/greeniYT/yt-bypass.js@main/bypass.js"></script>
  <script src="https://www.youtube.com/game_api/v1" nonce="7kM1qEi3lFk8GRyv_4r9pQ">// Load YT Game API code</script>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=100% height=100% tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
  </div>

  <script nonce="7kM1qEi3lFk8GRyv_4r9pQ">
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      // Uncomment below to show banners if needed
      // var div = document.createElement('div');
      // div.innerHTML = msg;
      // warningBanner.appendChild(div);
      // if (type == 'error') div.style = 'background: red; padding: 10px;';
      // else {
      //   if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
      //   setTimeout(function() { warningBanner.removeChild(div); }, 5000);
      // }
    }

    var buildUrl = "https://cdn.jsdelivr.net/gh/greeniYT/y@a8962253b2e5f7662366521797709f0eca5fb430/stick-war-legacy/Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      dataUrl: buildUrl + "/WebGL.data",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: null, // set after merging parts
      streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/greeniYT/y@a8962253b2e5f7662366521797709f0eca5fb430/stick-war-legacy/StreamingAssets",
      companyName: "Stick Page",
      productName: "Stick War: Legacy",
      productVersion: "2025.1.143",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    } else {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    }

    loadingBar.style.display = "block";

    var unityGameInstance = null;

    async function fetchWasmParts() {
      const [part1, part2] = await Promise.all([
        fetch(buildUrl + "/WebGL.wasm.part1").then(r => r.arrayBuffer()),
        fetch(buildUrl + "/WebGL.wasm.part2").then(r => r.arrayBuffer()),
      ]);
      const merged = new Uint8Array(part1.byteLength + part2.byteLength);
      merged.set(new Uint8Array(part1), 0);
      merged.set(new Uint8Array(part2), part1.byteLength);
      return URL.createObjectURL(new Blob([merged], { type: "application/wasm" }));
    }

    fetchWasmParts().then((wasmBlobUrl) => {
      config.codeUrl = wasmBlobUrl;
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          unityGameInstance = unityInstance;
          loadingBar.style.display = "none";
        }).catch((message) => {
          console.error(message);
        });
      };
      document.body.appendChild(script);
    }).catch((err) => {
      console.error("Failed to load WASM parts:", err);
    });
  </script>
</body>
</html>
